name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# No long-lived AWS keys: the job exchanges its GitHub OIDC token for the
# deploy role provisioned by infra/site.yml.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Fail if the export looks wrong
        run: |
          set -euo pipefail
          for f in out/index.html out/work/index.html out/404.html out/sitemap.xml out/robots.txt; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done
          # A de-indexed deploy is the failure mode most likely to go unnoticed.
          if grep -qi 'noindex' out/index.html; then
            echo "::error::out/index.html carries a noindex directive"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Three passes, because the tree has three different cache lifetimes.
      # Only /_next/ is content-hashed by the build, so only /_next/ can safely
      # be immutable. Image filenames are stable and hand-authored — marking
      # those immutable would leave a replaced photo stale in returning
      # visitors' browsers for a year, which no CloudFront invalidation can fix.
      - name: Upload hashed build assets
        run: |
          aws s3 sync out/_next/ "s3://${{ vars.AWS_S3_BUCKET }}/_next/" \
            --no-progress \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Upload images
        run: |
          aws s3 sync out/images/ "s3://${{ vars.AWS_S3_BUCKET }}/images/" \
            --no-progress --delete \
            --cache-control 'public,max-age=2592000'

      - name: Upload documents
        run: |
          aws s3 sync out/ "s3://${{ vars.AWS_S3_BUCKET }}" \
            --no-progress --delete \
            --exclude '_next/*' \
            --exclude 'images/*' \
            --cache-control 'public,max-age=0,must-revalidate'

      # --delete is on the image and document passes but deliberately not on
      # /_next/: superseded hashed chunks are left in place so a page load
      # already in flight doesn't break mid-navigation. They cost fractions of a
      # cent and can be pruned by hand if the bucket ever needs it.
      - name: Invalidate edge cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --no-cli-pager \
            --query 'Invalidation.Id' --output text
